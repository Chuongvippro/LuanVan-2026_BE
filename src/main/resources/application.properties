# ============================================
# 1. Cấu hình kết nối MySQL (Aiven - bắt buộc SSL)
# ============================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# 2. Cấu hình Hibernate (JPA MySQL)
# ============================================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# 3. Đổi cổng chạy (Render tự gán PORT, fallback 8090 nếu chạy local)
# ============================================
server.port=${PORT:8090}

# ============================================
# 4. Cấu hình Upload File (CV, Logo, Avatar)
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# ============================================
# 5. JWT Secret Key
# ============================================
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=420000
jwt.refresh-token-expiry=432000

# ============================================
# 6. GROQ API KEY
# ============================================
groq.api-keys=${GROQ_API_KEYS}

# ============================================
# 7. Cấu hình gửi Email (JavaMailSender)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true